<title id="card-pinterest-playbook-t">Pinterest playbook for AI characters — Claudia skill</title><desc id="card-pinterest-playbook-d">Grow an AI character on Pinterest: keyword boards, 2:3 Pins, AI-modified labels, and approve-each-Pin publishing. Steps: Set up the account honestly; Plan boards around searches; Find keywords with Pinterest Trends; Make Pins in Pinterest's specs; Write titles that match searches; Label AI the Pinterest way; Connect Pinterest and preview; Schedule one approved Pin at a time; Review weekly, decide monthly.</desc>
