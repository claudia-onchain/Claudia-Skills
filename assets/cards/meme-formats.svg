<title id="card-meme-formats-t">Meme formats — Claudia skill</title><desc id="card-meme-formats-d">On-brand memes and reaction posts: formats that last, trend timing, original images, rights and likeness rules, no punching down, labelled. Steps: Start from a shared truth; Pick a format family; Check the trend and the rights; Run the punch-down test; Generate the reaction images; Set the text and render; Label, caption and get a cold read; Publish while it's fresh; Watch the replies and retire the joke.</desc>
