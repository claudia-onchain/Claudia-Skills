<title id="card-social-listening-t">Social listening — Claudia skill</title><desc id="card-social-listening-d">Track mentions, keywords and sentiment within each platform's terms, triage what matters, and send a weekly listening report. Steps: Write the listening brief; Build the query set with exclusions; Pick sources inside their terms; Wire the collectors; Log and code every mention; Triage what needs a person; Compute the weekly numbers; Write the weekly report; Tune the queries monthly.</desc>
