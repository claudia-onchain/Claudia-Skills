<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="flow-t flow-d">
<title id="flow-t">How a skill works</title><desc id="flow-d">You ask; the agent matches a skill by its description, loads SKILL.md, does the work with your own keys, then checks and hands back for approval.</desc>
<style>.e{animation:flow 1.6s linear infinite}@keyframes flow{to{stroke-dashoffset:-20}}.h0{opacity:0;animation:h0 7500ms linear infinite}@keyframes h0{0%,0.00%{opacity:0}2.00%,20.00%{opacity:1}22.00%,100%{opacity:0}}.h1{opacity:0;animation:h1 7500ms linear infinite}@keyframes h1{0%,20.00%{opacity:0}22.00%,40.00%{opacity:1}42.00%,100%{opacity:0}}.h2{opacity:0;animation:h2 7500ms linear infinite}@keyframes h2{0%,40.00%{opacity:0}42.00%,60.00%{opacity:1}62.00%,100%{opacity:0}}.h3{opacity:0;animation:h3 7500ms linear infinite}@keyframes h3{0%,60.00%{opacity:0}62.00%,80.00%{opacity:1}82.00%,100%{opacity:0}}.h4{opacity:0;animation:h4 7500ms linear infinite}@keyframes h4{0%,80.00%{opacity:0}82.00%,100.00%{opacity:1}100.00%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect width="1200" height="270" rx="10" fill="#0a0b0d"/>
<rect x=".5" y=".5" width="1199" height="269" rx="10" fill="none" stroke="#353941"/>
<text x="46" y="44" fill="#868b92" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:11px;letter-spacing:.14em">CLAUDIA SKILLS</text><text x="46" y="72" fill="#ece9e2" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:26px">HOW A SKILL WORKS</text>
<rect x="46" y="92" width="196" height="120" rx="8" fill="#111317" stroke="#353941"/><rect class="h0" x="46" y="92" width="196" height="120" rx="8" fill="none" stroke="#ff6fa5" stroke-width="1.5"/><text x="64" y="122" fill="#868b92" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">01</text><text x="64" y="150" fill="#ece9e2" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">YOU ASK</text><text x="64" y="176" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">“Make a launch-day</text><text x="64" y="194" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">carousel for $DISCO”</text><path class="e" d="M244 152 L270 152" fill="none" stroke="#ff6fa5" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="272" y="92" width="196" height="120" rx="8" fill="#111317" stroke="#353941"/><rect class="h1" x="272" y="92" width="196" height="120" rx="8" fill="none" stroke="#ff6fa5" stroke-width="1.5"/><text x="290" y="122" fill="#868b92" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">02</text><text x="290" y="150" fill="#ece9e2" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">AGENT MATCHES</text><text x="290" y="176" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">the skill whose</text><text x="290" y="194" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">description fits</text><path class="e" d="M470 152 L496 152" fill="none" stroke="#ff6fa5" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="498" y="92" width="196" height="120" rx="8" fill="#111317" stroke="#353941"/><rect class="h2" x="498" y="92" width="196" height="120" rx="8" fill="none" stroke="#ff6fa5" stroke-width="1.5"/><text x="516" y="122" fill="#868b92" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">03</text><text x="516" y="150" fill="#ece9e2" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">LOADS SKILL.MD</text><text x="516" y="176" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">steps, templates,</text><text x="516" y="194" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">references on demand</text><path class="e" d="M696 152 L722 152" fill="none" stroke="#ff6fa5" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="724" y="92" width="196" height="120" rx="8" fill="#111317" stroke="#353941"/><rect class="h3" x="724" y="92" width="196" height="120" rx="8" fill="none" stroke="#ff6fa5" stroke-width="1.5"/><text x="742" y="122" fill="#868b92" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">04</text><text x="742" y="150" fill="#ece9e2" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">DOES THE WORK</text><text x="742" y="176" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">media · social ·</text><text x="742" y="194" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">cli · mcp, your keys</text><path class="e" d="M922 152 L948 152" fill="none" stroke="#ff6fa5" stroke-width="1.5" stroke-dasharray="4 6"/><rect x="950" y="92" width="196" height="120" rx="8" fill="#111317" stroke="#353941"/><rect class="h4" x="950" y="92" width="196" height="120" rx="8" fill="none" stroke="#ff6fa5" stroke-width="1.5"/><text x="968" y="122" fill="#868b92" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:10.5px;letter-spacing:.12em">05</text><text x="968" y="150" fill="#ece9e2" style="font-family:'Barlow Condensed','Roboto Condensed','Arial Narrow','Helvetica Neue',Arial,sans-serif;font-weight:700;font-size:21px">HANDS BACK</text><text x="968" y="176" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">labelled, priced,</text><text x="968" y="194" fill="#b4b7bc" style="font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-size:13px">waits for your yes</text>
<text x="46" y="250" fill="#868b92" style="font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace;font-size:11px">Only the name and description sit in context until a request matches. Then the agent reads SKILL.md, and a reference only when a step says so.</text>
</svg>
