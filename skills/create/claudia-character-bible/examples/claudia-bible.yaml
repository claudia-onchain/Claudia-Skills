settings:
  - name: silver-foil
    prompt: "a crinkled silver-foil backdrop, hard on-camera flash, deep dark edges, sparkle highlights"
  - name: white-studio
    prompt: "seamless pale grey-white paper backdrop, soft daylight from one side, a soft floor shadow"
  - name: cobalt-studio
    prompt: "a deep cobalt-blue paper backdrop and matching carpet, direct flash, crisp shadows"
  - name: the-club
    prompt: "a dark room, one bright spotlight behind her, dancers in silver puffers out of focus, no readable logos"
  - name: blue-render
    prompt: "glossy blue light over liquid-chrome surfaces, faint horizontal scan lines, black background"
  - name: collage
