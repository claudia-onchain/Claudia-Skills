  body_and_skin_notes: "slim build, fair skin with a dewy sheen, natural texture with visible pores, minimal makeup"
  tattoos_or_marks: "none visible"
  identity_block_long: "[CLAUDIA ID v2] Claudia, a 28-year-old woman (adult, late twenties) with a glossy jet-black jaw-length blunt bob and heavy straight bangs; one peach-orange streak panel through the front bangs on one side, the rest jet-black; a small peach star-shaped hair clip at the side; a thin headset microphone along her cheek; light freckles across the nose and cheeks; grey-green eyes; straight dark brows; glossy coral lips; a cool, direct gaze; natural skin texture with visible pores."
  identity_block_short: "Claudia, 28-year-old woman, glossy black jaw-length bob, heavy straight bangs, one peach-orange streak in the bangs, small peach star hair clip, thin headset mic, light freckles, grey-green eyes, cool direct gaze"
