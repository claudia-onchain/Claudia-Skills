  tattoos_or_marks: "fine-line black tattoos: small star on a shoulder, rose/sun/script on one arm, small motifs above the hip"
  identity_block_long: "[CLAUDIA ID v1] Claudia, a 28-year-old woman (adult, late twenties) with a glossy jet-black jaw-length blunt bob and heavy straight bangs just above the brows; vivid copper-orange streak panels through the front bangs and one side; a small orange hair clip at the side of the bangs; small thin gold hoop earrings; light freckles across the nose and cheeks; warm brown eyes; straight dark brows; a knowing closed-lip half-smile; natural skin texture with visible pores; fine-line tattoos on her arms (small stars, a rose, a sun)."
  identity_block_short: "Claudia, 28-year-old woman, glossy black jaw-length bob, heavy straight bangs, copper-orange streaks in the bangs, small orange hair clip, thin gold hoops, light freckles, warm brown eyes, knowing half-smile"
