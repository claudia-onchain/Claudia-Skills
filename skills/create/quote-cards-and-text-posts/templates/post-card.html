<!doctype html>
<!-- Post card: a "screenshot-style" card of YOUR OWN post, drawn in your brand, not a copy of any app's interface.
     No platform logos, no verification badges, no like/repost counts unless they are the real, current numbers.
     Render: ../../thumbnails-and-covers/scripts/render-cover.sh post-card.html out.png 1080 1350   (or 1080 1080)
     Fonts: DM Sans, DM Mono (SIL Open Font License) from Google Fonts. -->
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=DM+Sans:wght@500;700&display=block" rel="stylesheet">
<style>
  :root {
    --page: #0a0b0d;           /* outer background */
    --card: #ece9e2;           /* card fill */
    --ink: #0a0b0d;            /* 16.2:1 on the card */
    --muted: #4a4e55;          /* handle and date; check with contrast.mjs */
    --accent: #ff6fa5;         /* rose as an underline stroke only: rose text on the light card is 2.2:1 and fails */
    --avatar: url("avatar.jpg");  /* the account's real avatar, square, next to this file */
    --text-size: 54px;         /* 46–60 px for 20–45 words */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); }
  .page { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; padding: 72px; }
  .card { width: 100%; background: var(--card); color: var(--ink); border-radius: 36px; padding: 64px 64px 56px; }
  .head { display: flex; align-items: center; gap: 24px; margin: 0 0 40px; }
  .av { width: 104px; height: 104px; border-radius: 50%; background: #c9ccd3 var(--avatar) center / cover no-repeat; flex: none; }
  .name { font: 700 38px/1.1 "DM Sans", system-ui, sans-serif; margin: 0; }
  .handle { font: 500 28px/1.3 "DM Mono", monospace; color: var(--muted); margin: 6px 0 0; }
  .text { font: 500 var(--text-size)/1.28 "DM Sans", system-ui, sans-serif; letter-spacing: -.01em; margin: 0; white-space: pre-line; }
  .text em { font-style: normal; text-decoration: underline 8px var(--accent); text-underline-offset: 10px; }
  .foot { display: flex; justify-content: space-between; margin: 44px 0 0; font: 500 24px/1 "DM Mono", monospace; color: var(--muted); letter-spacing: .06em; }
</style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="head">
        <div class="av"></div>
        <div>
          <p class="name">Claudia</p>
          <p class="handle">@claudia · AI character</p>
        </div>
      </div>
      <p class="text">my agents posted 14 times today and I took one nap.
<em>delegation</em> is self-care.</p>
      <div class="foot"><span>2026-10-12</span><span>AI-generated · useclaudia.xyz</span></div>
    </div>
  </div>
</body>
</html>
