# UGC format cards. Each card = first frame (image) + video prompt + settings. Prices: package table, checked 2026-10.
# {ID} = full [CLAUDIA ID v2] block · {SHORT} = short video ID block:
#   "Same woman as the first frame: Claudia, 28-year-old woman (adult), black jaw-length bob, heavy bangs with one peach-orange
#    streak panel, star clip, headset mic, freckles."
# {UGC} = "24mm phone front camera look, slightly above eye level, slight sensor noise, vertical 9:16, natural skin texture
#    with visible pores, no text, no UI overlay"

cards:
  - id: studio-talk
    name: Talking to camera, white studio
    first_frame: "{ID} Studio look: a cropped white puffed-sleeve shirt with a small star pin, a black patent pleated mini skirt, long black patent gloves. A paused frame from a locked-off camera: mid-laugh, framed from mid-thigh up. Seamless pale grey-white paper, soft even daylight. 50mm look, eye level, vertical 9:16, natural skin texture with visible pores, no text."
    video: "{SHORT} She talks to the locked-off camera. 0-4s: she laughs and starts a story. 4-9s: a big open smile, a small sway. 9-14s: she says the line, then settles into a calm, steady gaze. Claudia (amused, warm, English): \"<line, max 15 words>\". Same white studio, soft daylight. The camera does not move. Room tone only, no music."
    model: fal/kling-3-pro
    duration_s: 14
    audio: "native (≈ $2.35) or silent + lip-sync (≈ $1.57 + lip-sync)"

  - id: club-selfie
    name: Flash selfie at the club
    first_frame: "{ID} Club look: a silver quilted puffer. Selfie at arm's length in a dark club, the phone flash on, laughing with her mouth open, one spotlight blooming behind her, dancers in silver puffers out of focus. {UGC}"
    video: "{SHORT} She holds the phone at arm's length, laughing, the flash on. 0-4s: she talks to the lens, the spotlight behind her. 4-8s: she half-spins to show the crowd in silver puffers, then looks back and laughs. The camera moves with her arm, bouncing to the beat. SFX: bass through the floor, crowd noise, breathless laughter. No music."
    model: fal/kling-3-pro
    duration_s: "8 + 5 stitched (or fal/wan-2.6 15 s at 720p, $1.50)"
    audio: native ambience

  - id: mirror-check
    name: Mirror outfit check
    first_frame: "{ID} Signature look. She stands in front of a tall dressing-room mirror filming her reflection with one phone in her right hand, hip popped, cool look. Mirror bulbs, a clothing rail with silver and patent pieces and polaroids behind her. Mirror selfie, vertical 9:16, natural skin texture."
    video: "Claudia, 28-year-old woman with a black bob, a peach-orange bang streak and a star clip, films herself in a tall dressing-room mirror, turns left then right to show her white puffed-sleeve vinyl top, then lowers the phone and grins at her reflection. One phone in her right hand. Handheld, mirror bulbs."
    model: fal/hailuo-2.3
    duration_s: 10
    audio: silent; add music in edit

  - id: grwm-clip
    name: Get ready with me — the clip goes on last
    first_frame: "{ID} white puffed-sleeve vinyl top. She sits at a small vanity with bulb lights, phone propped against the mirror, holding the small peach star clip between two fingers near her bangs. Warm bulb light. {UGC}"
    video: "{SHORT} Phone propped on the vanity, static. 0-5s: she clips the small peach star clip into the side of her bangs and checks it. 5-10s: she settles the headset mic along her cheek. 10-15s: she pins the small star pin to her collar, looks into the lens and gives a cool, direct gaze. Claudia (soft, conspiratorial): \"the clip goes on last. that's the whole secret.\" Room tone, no music."
    model: fal/kling-3-pro
    duration_s: 15
    audio: native (≈ $2.52)

  - id: club-exit
    name: Walk-and-talk out of the club
    first_frame: "{ID} Club look. Walking down a dark corridor out of the club, phone held in front of her, smiling mid-sentence, a bright doorway behind her. {UGC}"
    video: "{SHORT} She walks down the corridor holding the phone in front of her, talking and smiling; the camera moves at her walking pace with a gentle bounce. Anyone behind her is blurred and anonymous. Claudia (relaxed): \"the flash did the lighting, I just showed up.\" Ambient: muffled bass behind a door, footsteps. No music."
    model: google/omni-flash
    duration_s: "~10 (say 'a 10-second clip' in the prompt)"
    audio: native

  - id: desk-pov
    name: Desk POV with the disco ball
    first_frame: "First-person POV of the studio desk: a laptop with a chrome star sticker, a black mug with a chrome star, two monitors with abstract candlestick charts (no readable text), the disco ball on its stand by the keyboard, rose lamp and purple-rose monitor glow. Vertical 9:16, phone camera look."
    video: "First-person POV at the desk. Claudia's hand in a long black patent glove reaches in and gives the disco ball a spin; light points slide across the screens. Slight handheld drift. No readable text on the screens. Room tone, keyboard click, a soft motor whir."
    model: fal/kling-3-pro
    duration_s: 8
    audio: native (≈ $1.34)

  - id: foil-storytime
    name: Storytime on the foil set
    first_frame: "{ID} Signature look. Sitting on an apple box in front of crinkled silver foil, phone propped on a light stand, one modelling light across her cheek, polaroids taped behind. {UGC}"
    video: "{SHORT} Sitting on the apple box, talking to the propped phone. 0-4s: she starts the story, rolls her eyes. 4-8s: she laughs into her puffed sleeve. 8-12s: she looks back up at the lens with a cool gaze. Claudia (quiet, amused): \"so the disco ball is technically my CTO now.\" Room tone, no music."
    model: fal/kling-3-pro
    duration_s: 12
    audio: native or silent + lip-sync

  - id: visor-reveal
    name: Visor-reveal vlog
    first_frame: "{ID} Sky look: a cloud-print halter gown with a mint satin halter band, the orange shield visor down over her eyes. White studio, soft daylight, front camera at arm's length. {UGC}"
    video: "Claudia, 28-year-old woman with a black bob, a peach-orange bang streak, star clip and headset mic, lifts the orange visor into her bangs and looks into the front camera with a slow smile. Handheld, soft daylight. Room tone."
    model: fal/hailuo-2.3
    duration_s: 6
    audio: silent (add a visor-flip SFX in edit)

  - id: cobalt-turn
    name: Cobalt studio turn
    first_frame: "{ID} Holo look: a holographic bell-sleeve mini dress, white patent platform boots, tiny orange oval sunglasses. Full length on the cobalt-blue paper, hands on hips, phone on a tripod. Vertical 9:16, natural skin texture."
    video: "{SHORT} On the cobalt studio, she turns slowly on the spot so the holographic dress flares in rainbow streaks under the flash, then stops facing the lens and pushes the tiny sunglasses down. Static tripod. Ambient: studio room tone, a flash pop on the stop. No music."
    model: fal/kling-3-pro
    duration_s: 10
    audio: native

  - id: coffee-apple-box
    name: Coffee between takes
    first_frame: "{ID} Signature look. She holds a black mug with a chrome star on an apple box at the edge of the set, steam rising, the disco ball beside her, phone propped on a light stand. {UGC}"
    video: "{SHORT} Phone propped on the light stand, static. She blows on the coffee, takes a sip, glances at the set, then at the lens and raises the mug slightly. Modelling light. Room tone, distant crew chatter, no music."
    model: fal/hailuo-2.3
    duration_s: 6
    audio: silent
