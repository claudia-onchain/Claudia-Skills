# Trend scoring config an agent can load. Values are defaults; tune after 4 weeks of logged results.
version: "1.0.0"
updated: "2026-10-08"

formula: "2*fit + velocity + window - effort"
range: { min: -5, max: 20 }

thresholds:
  go: 12          # brief today, produce inside the window
  adapt: 8        # 8-11: find a cheaper angle or hold 48 h
  # below 8: skip and log the reason

weights:
  fit: 2
  velocity: 1
  window: 1
  effort: -1

pacing:
  reactive_share_max: 0.30          # of weekly posts
  reactive_per_platform_per_day: 1
  briefs_per_day_max: 1             # an autonomous agent proposes at most one new trend brief a day
  hold_unknown_origin_hours: 48

factors:
  fit:
    5: "Only she would make this version; native to a pillar and her world"
    4: "Clearly on-pillar; her setting works without forcing"
    3: "Works with a twist; adjacent audience"
    2: "Doable but says nothing about her"
    1: "Out of character without a reframe"
    0: "Contradicts brand or never-list"
  velocity:
    5: "Accelerating; curve steepening 3+ days; multiple niche accounts in last 24 h"
    3: "Rising steadily"
    1: "Falling"
    0: "Dead, or one viral post with no copies"
  window:
    5: "1-3 weeks left"
    3: "3-7 days left"
    1: "Under 24 h left"
    0: "Already stale"
  effort:
    0: "Text post or re-cut of an existing loop"
    2: "One new image generation + edit"
    3: "New short video generation + edit + audio"
    5: "Multi-day production or needs another account's approval"

gates_red:            # any 'yes' = skip, never overridden by an agent
  - id: 1
    ask: "Is it about a death, disaster, attack, war, illness or anyone's suffering?"
  - id: 2
    ask: "Does it need a real person's face, voice, name or likeness?"
  - id: 3
    ask: "Does it involve or appeal to minors?"
  - id: 4
    ask: "Is it a coin, pump, launch countdown or price prediction?"
  - id: 5
    ask: "Is it about elections, candidates or political persuasion?"
  - id: 6
    ask: "Does it involve physical danger, drugs, weapons, gambling or get-rich-quick?"
  - id: 7
    ask: "Does it require claiming to be human or to have used a product (and can't be reframed)?"
  - id: 8
    ask: "Does it mock a group, body, accent, culture, religion or disability?"
  - id: 10
    ask: "Is the post commercial and the audio not cleared for commercial use?"

gates_hold:
  - id: 9
    ask: "Unknown origin or possible hoax started in the last 24 h?"
    action: "hold 48 h, re-check"

gates_amber:          # needs a person's explicit OK recorded in the brief
  - "Another company's campaign trend"
  - "Humour adjacent to a non-tragic news story"
  - "Remix of a named creator's original format (credit required)"
  - "Possible conflict with a current brand partner"

labels_default:
  ai: true            # always
  ad: false           # true if paid, gifted, affiliate, or own product/platform/launch
  nfa: false          # true whenever market words appear; the social package forces it anyway
