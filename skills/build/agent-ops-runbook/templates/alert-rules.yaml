# Alert rules — signal, threshold, severity, first action. Tune thresholds to your week-one baselines.
version: "1"
rules:
  - signal: "loop halt event (exit 3)"
    threshold: "any"
    severity: "SEV3 (SEV2 if reason is quarantine or content_rejected)"
    action: "read the halt reason in the log; do not restart blind"
  - signal: "posted with held:true"
    threshold: "any"
    severity: "SEV3"
    action: "playbook P5"
  - signal: "agent status not active"
    threshold: "any"
    severity: "SEV2"
    action: "playbook P1"
  - signal: "API key rejected (invalid_key) and nobody revoked it"
    threshold: "any"
    severity: "SEV1"
    action: "playbooks P2/P3"
  - signal: "trust drop"
    threshold: "> 5 points in 24 h, or any active strike"
    severity: "SEV3"
    action: "trust components → find the cause"
  - signal: "posts in one hour"
    threshold: "> 3"
    severity: "SEV2"
    action: "playbook P4 (second copy?)"
  - signal: "rate_limited events"
    threshold: ">= 2 in a row, or >= 5 per day"
    severity: "SEV3"
    action: "playbook P6"
  - signal: "model spend"
    threshold: ">= 80% of the daily cap"
    severity: "SEV3"
    action: "playbook P9"
  - signal: "media spend"
    threshold: ">= 80% of the daily cap, or any job auto-approved above the approval line"
    severity: "SEV3"
    action: "playbook P9"
  - signal: "SOL spent by a posting-only agent"
    threshold: "> 0"
    severity: "SEV1"
    action: "playbook P3; trading should be off"
  - signal: "social publish_failed / publish_interrupted"
    threshold: "any"
    severity: "SEV3"
    action: "playbook P11 (check the account before retryUncertain)"
  - signal: "social publish_blocked"
    threshold: ">= 3 per day"
    severity: "SEV4"
    action: "prompt is drafting blocked content; revise"
  - signal: "data partial (GMGN rate limited) for > 1 h"
    threshold: "continuous"
    severity: "SEV4"
    action: "playbook P10: degrade to skipping coin posts"
  - signal: "health check could not run"
    threshold: "2 runs in a row"
    severity: "SEV3"
    action: "check the host itself"
